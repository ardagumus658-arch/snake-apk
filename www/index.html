<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Yılan</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
margin:0;
background:#101010;
color:white;
font-family:Arial,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden
}

#app{
width:min(94vw,480px);
text-align:center
}

.screen{display:none}
.screen.active{display:block}

h1{
font-size:48px;
margin:10px 0
}

.subtitle{
color:#aaa;
margin-bottom:35px
}

button{
border:0;
border-radius:15px;
background:#333;
color:white;
font-size:20px;
font-weight:bold;
padding:16px 25px;
margin:7px;
cursor:pointer
}

.primary{
background:#35a853;
width:80%
}

#top{
display:flex;
justify-content:space-between;
font-size:18px;
margin-bottom:8px
}

canvas{
width:100%;
aspect-ratio:1;
background:#181818;
border:3px solid #444;
border-radius:12px;
touch-action:none
}

#controls{
display:grid;
grid-template-columns:repeat(3,70px);
justify-content:center;
gap:6px;
margin-top:12px
}

.control{
width:70px;
height:55px;
padding:0;
font-size:25px
}

.empty{
visibility:hidden
}

.panel{
background:#202020;
padding:30px 20px;
border-radius:22px
}

.panel h2{
font-size:32px;
margin-top:0
}

#gameover{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
padding:20px
}

#gameover.show{
display:flex
}

.small{
font-size:14px;
color:#888;
margin-top:25px
}
</style>
</head>

<body>

<div id="app">

<!-- ANA MENÜ -->
<div id="menu" class="screen active">

<h1>🐍</h1>
<h1>YILAN</h1>

<p class="subtitle">Elmaları ye, büyü ve rekorunu kır!</p>

<button class="primary" onclick="startGame()">
▶ OYNA
</button>

<p class="small">
En yüksek skor: <b id="menuHighScore">0</b>
</p>

</div>


<!-- OYUN -->
<div id="game" class="screen">

<div id="top">
<span>🍎 Skor: <b id="score">0</b></span>
<span>🏆 Rekor: <b id="highScore">0</b></span>
</div>

<canvas id="canvas" width="400" height="400"></canvas>

<div id="controls">

<button class="empty"></button>
<button class="control" onclick="changeDirection('up')">⬆️</button>
<button class="empty"></button>

<button class="control" onclick="changeDirection('left')">⬅️</button>
<button class="control" onclick="changeDirection('down')">⬇️</button>
<button class="control" onclick="changeDirection('right')">➡️</button>

</div>

<button onclick="goMenu()" style="font-size:14px;padding:10px 15px">
Menü
</button>

</div>

</div>


<!-- OYUN BİTTİ -->
<div id="gameover">

<div class="panel">

<h2>💥 Yandın!</h2>

<p>Skorun: <b id="finalScore">0</b></p>

<button class="primary" id="rewardButton" onclick="watchRewardAd()">
📺 Reklam izle ve devam et
</button>

<br>

<button onclick="startGame()">
🔄 Baştan Başla
</button>

<br>

<button onclick="goMenu()">
🏠 Menü
</button>

</div>

</div>


<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const grid=20;
const tiles=20;

let snake=[];
let apple={x:5,y:5};

let direction="right";
let nextDirection="right";

let score=0;

let gameRunning=false;
let continueUsed=false;

let highScore=
Number(localStorage.getItem("snakeHighScore"))||0;

document.getElementById("highScore").textContent=highScore;
document.getElementById("menuHighScore").textContent=highScore;


// Ekran değiştir
function showScreen(id){

document.querySelectorAll(".screen")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

}


// Oyunu başlat
function startGame(){

showScreen("game");

document.getElementById("gameover")
.classList.remove("show");

snake=[
{x:10,y:10},
{x:9,y:10},
{x:8,y:10}
];

direction="right";
nextDirection="right";

score=0;
continueUsed=false;
gameRunning=true;

document.getElementById("score").textContent=score;

spawnApple();

}


// Elma oluştur
function spawnApple(){

do{

apple={
x:Math.floor(Math.random()*tiles),
y:Math.floor(Math.random()*tiles)
};

}while(
snake.some(s=>s.x===apple.x&&s.y===apple.y)
);

}


// Yön
function changeDirection(dir){

if(dir==="up"&&direction!=="down")
nextDirection="up";

if(dir==="down"&&direction!=="up")
nextDirection="down";

if(dir==="left"&&direction!=="right")
nextDirection="left";

if(dir==="right"&&direction!=="left")
nextDirection="right";

}


// Klavye
document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp")changeDirection("up");
if(e.key==="ArrowDown")changeDirection("down");
if(e.key==="ArrowLeft")changeDirection("left");
if(e.key==="ArrowRight")changeDirection("right");

});


// Kaydırma
let sx=0;
let sy=0;

canvas.addEventListener("touchstart",e=>{

sx=e.touches[0].clientX;
sy=e.touches[0].clientY;

},{passive:true});


canvas.addEventListener("touchend",e=>{

let ex=e.changedTouches[0].clientX;
let ey=e.changedTouches[0].clientY;

let dx=ex-sx;
let dy=ey-sy;

if(Math.abs(dx)>Math.abs(dy)){

if(dx>20)changeDirection("right");
if(dx<-20)changeDirection("left");

}else{

if(dy>20)changeDirection("down");
if(dy<-20)changeDirection("up");

}

},{passive:true});


// Güncelle
function update(){

if(!gameRunning)return;

direction=nextDirection;

let head={
x:snake[0].x,
y:snake[0].y
};

if(direction==="up")head.y--;
if(direction==="down")head.y++;
if(direction==="left")head.x--;
if(direction==="right")head.x++;


// Duvar
if(
head.x<0||
head.x>=tiles||
head.y<0||
head.y>=tiles
){

die();
return;

}


// Kendine çarpma
if(
snake.some(s=>s.x===head.x&&s.y===head.y)
){

die();
return;

}

snake.unshift(head);


// Elma
if(head.x===apple.x&&head.y===apple.y){

score++;

document.getElementById("score").textContent=score;

if(score>highScore){

highScore=score;

localStorage.setItem(
"snakeHighScore",
highScore
);

document.getElementById("highScore")
.textContent=highScore;

document.getElementById("menuHighScore")
.textContent=highScore;

}

spawnApple();

}else{

snake.pop();

}

}


// Öl
function die(){

gameRunning=false;

document.getElementById("finalScore")
.textContent=score;

document.getElementById("gameover")
.classList.add("show");


// Devam hakkı kullanıldıysa butonu kapat
if(continueUsed){

document.getElementById("rewardButton")
.style.display="none";

}else{

document.getElementById("rewardButton")
.style.display="inline-block";

}

}


// Şimdilik TEST devamı
// APK aşamasında bu fonksiyona AdMob Rewarded SDK bağlanacak.
function watchRewardAd(){

if(continueUsed)return;

// Geliştirme testi
alert(
"TEST REKLAMI\n\n" +
"APK sürümünde burada AdMob ödüllü reklam açılacak."
);

continueUsed=true;

continueGame();

}


// Reklam ödülü verildiğinde
function continueGame(){

document.getElementById("gameover")
.classList.remove("show");

snake=[
{x:10,y:10},
{x:9,y:10},
{x:8,y:10}
];

direction="right";
nextDirection="right";

spawnApple();

gameRunning=true;

}


// Menü
function goMenu(){

gameRunning=false;

document.getElementById("gameover")
.classList.remove("show");

showScreen("menu");

}


// Çiz
function draw(){

ctx.fillStyle="#181818";
ctx.fillRect(0,0,400,400);


// Elma
ctx.fillStyle="#e53935";

ctx.beginPath();

ctx.arc(
apple.x*grid+10,
apple.y*grid+10,
8,
0,
Math.PI*2
);

ctx.fill();


// Yılan
snake.forEach((part,index)=>{

ctx.fillStyle=
index===0?"#66bb6a":"#43a047";

ctx.fillRect(
part.x*grid+1,
part.y*grid+1,
18,
18
);

});

}


// Döngü
setInterval(()=>{

update();
draw();

},120);


// İlk çizim
startGame();

</script>

</body>
</html>
